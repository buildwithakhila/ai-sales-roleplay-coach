<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TTS Demo — text → speech</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.25rem; }
  textarea { width: 100%; height: 100px; font-size: 1rem; padding: 8px; box-sizing: border-box; }
  button { font-size: 1rem; padding: 8px 16px; margin-top: 8px; cursor: pointer; }
  #status { color: #666; margin: 12px 0; }
</style>
</head>
<body>
  <h1>Week 1 demo: text → ElevenLabs speech</h1>
  <p>Isolated demo — no STT, no LLM, no persona. Just: can we get a voice out of text reliably?</p>
  <textarea id="text">Hi, thanks for taking my call today. I wanted to walk you through how this could fit your team.</textarea>
  <br />
  <button id="speakBtn">Speak</button>
  <div id="status">idle</div>
  <audio id="player" controls style="width: 100%; margin-top: 12px;"></audio>

  <script src="client.js"></script>
</body>
</html>
